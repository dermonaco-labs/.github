name: Maintenance request
description: Request a non-security maintenance or operational improvement
title: "chore: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials or sensitive infrastructure details. [Report vulnerabilities privately](https://github.com/dermonaco-labs/.github/security/advisories/new).
  - type: input
    id: component
    attributes:
      label: Affected component
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Maintenance need
      description: Describe the problem, lifecycle event, or operational burden.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Deployment and rollback impact
      description: State whether runtime, data, or external services could be affected.